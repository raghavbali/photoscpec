[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photoscpec"
version = "0.1.0"
description = "Privacy-first local passport, visa and document photo preparation tool."
requires-python = ">=3.12"
dependencies = ["pillow>=11.3,<13", "pyyaml>=6.0.2,<7", "reportlab>=4.4,<5", "streamlit>=1.49,<2"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.12,<1", "pypdf>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/photoscpec", "frontend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
