name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Capture initial dependency lock
        if: runner.os == 'Linux'
        run: uv run python -c 'import json,pathlib; print("PHOTOSCPEC_LOCK="+json.dumps(pathlib.Path("uv.lock").read_text()))'
      - run: uv run ruff check .
      - run: uv run python scripts/validate_configs.py
      - run: uv run pytest -q
